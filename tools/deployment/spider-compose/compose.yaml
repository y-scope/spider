name: "spider"

include:
  - "./configs/database.yaml"
  - "./configs/entrypoints.yaml"
  - "./configs/scheduler/${SPIDER_SCHEDULER_POLICY:-resource_group_round_robin}.yaml"
  - "./configs/storage.yaml"
  - "./configs/worker.yaml"

x-service-defaults: &service_defaults
  logging:
    driver: "local"
  pull_policy: "${SPIDER_PULL_POLICY:-always}"
  restart: "${SPIDER_RESTART_POLICY:-unless-stopped}"
  stop_grace_period: "60s"

x-healthcheck-defaults: &healthcheck_defaults
  interval: "30s"
  retries: 3
  start_interval: "2s"
  start_period: "60s"
  timeout: "2s"

x-worker-defaults: &worker_defaults
  <<: *service_defaults
  image: >-
    ${SPIDER_WORKER_IMAGE_REF:-ghcr.io/y-scope/spider/worker:${SPIDER_IMAGE_TAG:-main}}
  networks:
    - "default"
    - "spider-internal"
  entrypoint: [
    "bash", "/etc/spider/worker-entrypoint.sh",
  ]
  command: [
    "spider-execution-manager",
    "--config", "/etc/spider/worker.yaml",
  ]
  configs:
    - source: "spider-worker-config"
      target: "/etc/spider/worker.yaml"
    - source: "spider-worker-entrypoint"
      target: "/etc/spider/worker-entrypoint.sh"
  depends_on:
    spider-scheduler:
      condition: "service_healthy"
      restart: true
    spider-storage:
      condition: "service_healthy"
      restart: true

services:
  spider-database:
    <<: *service_defaults
    image: "${SPIDER_DATABASE_IMAGE_REF:-mariadb:10.11.16}"
    networks:
      - "spider-internal"
    command: [
      "--port=${SPIDER_DATABASE_PORT:-3306}",
    ]
    environment:
      MYSQL_DATABASE: "${SPIDER_DATABASE_NAME:-spider-db}"
      MYSQL_PASSWORD: "${SPIDER_STORAGE_DB_PASSWORD:-spider-password}"
      MYSQL_ROOT_PASSWORD: "${SPIDER_DATABASE_ROOT_PASSWORD:-spider-root-password}"
      MYSQL_USER: "${SPIDER_STORAGE_DB_USERNAME:-spider-user}"
    configs:
      - source: "spider-database-init-script"
        target: "/docker-entrypoint-initdb.d/grant-process.sh"
    volumes:
      - type: "volume"
        source: "spider-database-data"
        target: "/var/lib/mysql"
    healthcheck:
      <<: *healthcheck_defaults
      test: [
        "CMD",
        "mysqladmin", "ping",
        "--silent",
        "-h", "127.0.0.1",
        "-P", "${SPIDER_DATABASE_PORT:-3306}",
        "-u", "${SPIDER_STORAGE_DB_USERNAME:-spider-user}",
        "--password=${SPIDER_STORAGE_DB_PASSWORD:-spider-password}",
      ]

  spider-storage:
    <<: *service_defaults
    image: >-
      ${SPIDER_STORAGE_IMAGE_REF:-ghcr.io/y-scope/spider/storage:${SPIDER_IMAGE_TAG:-main}}
    networks:
      - "default"
      - "spider-internal"
    command: [
      "spider-storage",
      "--config", "/etc/spider/storage.yaml",
    ]
    environment:
      RUST_LOG: "${SPIDER_STORAGE_LOG_LEVEL:-INFO}"
      SPIDER_STORAGE_DB_PASSWORD: "${SPIDER_STORAGE_DB_PASSWORD:-spider-password}"
      SPIDER_STORAGE_DB_USERNAME: "${SPIDER_STORAGE_DB_USERNAME:-spider-user}"
    ports:
      - host_ip: "${SPIDER_STORAGE_PUBLISHED_IP:-127.0.0.1}"
        published: "${SPIDER_STORAGE_PUBLISHED_PORT:-50051}"
        target: "${SPIDER_STORAGE_PORT:-50051}"
    configs:
      - source: "spider-storage-config"
        target: "/etc/spider/storage.yaml"
    depends_on:
      spider-database:
        condition: "service_healthy"
        restart: true
    healthcheck:
      <<: *healthcheck_defaults
      test: [
        "CMD",
        "timeout", "2",
        "bash", "-c", "</dev/tcp/127.0.0.1/${SPIDER_STORAGE_PORT:-50051}",
      ]

  spider-scheduler:
    <<: *service_defaults
    image: >-
      ${SPIDER_SCHEDULER_IMAGE_REF:-ghcr.io/y-scope/spider/scheduler:${SPIDER_IMAGE_TAG:-main}}
    networks:
      - "spider-internal"
    entrypoint: [
      "bash", "/etc/spider/scheduler-entrypoint.sh",
    ]
    command: [
      "spider-scheduler",
      "--config", "/tmp/scheduler.yaml",
    ]
    environment:
      RUST_LOG: "${SPIDER_SCHEDULER_LOG_LEVEL:-INFO}"
    configs:
      - source: "spider-scheduler-config"
        target: "/etc/spider/scheduler.template.yaml"
      - source: "spider-scheduler-entrypoint"
        target: "/etc/spider/scheduler-entrypoint.sh"
    depends_on:
      spider-storage:
        condition: "service_healthy"
        restart: true
    healthcheck:
      <<: *healthcheck_defaults
      test: [
        "CMD",
        "timeout", "2",
        "bash", "-c", "</dev/tcp/127.0.0.1/${SPIDER_SCHEDULER_PORT:-50052}",
      ]

  spider-worker:
    <<: *worker_defaults
    environment:
      RUST_LOG: "${SPIDER_WORKER_LOG_LEVEL:-INFO}"
      SPIDER_WORKER_COUNT: "${SPIDER_WORKER_COUNT:-}"
      SPIDER_WORKER_CPU_PERCENT: "${SPIDER_WORKER_CPU_PERCENT:-100}"
    deploy:
      # A replica is a container, and one container runs all of the pool's workers: 1 runs the pool,
      # and 0 turns it off.
      replicas: "${SPIDER_WORKER_REPLICAS:-1}"

  spider-worker-dedicated:
    <<: *worker_defaults
    environment:
      RUST_LOG: "${SPIDER_WORKER_LOG_LEVEL:-INFO}"
      SPIDER_EXTERNAL_RESOURCE_GROUP_ID: "${SPIDER_DEDICATED_RESOURCE_GROUP_ID:-}"
      SPIDER_RESOURCE_GROUP_PASSWORD: "${SPIDER_DEDICATED_RESOURCE_GROUP_PASSWORD:-}"
      SPIDER_WORKER_COUNT: "${SPIDER_DEDICATED_WORKER_COUNT:-}"
      SPIDER_WORKER_CPU_PERCENT: "${SPIDER_DEDICATED_WORKER_CPU_PERCENT:-0}"
    deploy:
      # A replica is a container, and one container runs all of the pool's workers: 1 runs the pool,
      # and 0 turns it off.
      replicas: "${SPIDER_DEDICATED_WORKER_REPLICAS:-0}"

networks:
  default:
  spider-internal:
    internal: true

volumes:
  spider-database-data:
