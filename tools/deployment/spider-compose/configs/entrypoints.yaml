configs:
  # Entrypoint of the scheduler container: resolves a dispatch queue capacity of `auto` in the
  # scheduler's config to four task assignments per CPU core, then runs the container's command.
  spider-scheduler-entrypoint:
    content: |
      #!/usr/bin/env bash

      set -o errexit
      set -o nounset
      set -o pipefail

      readonly CONFIG_TEMPLATE_PATH="/etc/spider/scheduler.template.yaml"
      readonly CONFIG_PATH="/tmp/scheduler.yaml"

      num_cpus=$$(nproc)
      dispatch_queue_capacity=$$(( 4 * num_cpus ))

      # The template has the capacity's value on the line after its key.
      sed "/dispatch_queue_capacity:/{n;s/^\( *\)auto$$/\1$${dispatch_queue_capacity}/}" \
          "$$CONFIG_TEMPLATE_PATH" > "$$CONFIG_PATH"

      exec "$$@"

  # Entrypoint of a worker container: runs a pool of workers (execution managers), each one a copy
  # of the container's command.
  #
  # Environment variables:
  # - SPIDER_WORKER_COUNT: The number of workers to run. If empty, the pool runs one worker for
  #   every CPU core in its `SPIDER_WORKER_CPU_PERCENT` share, with a minimum of one worker.
  # - SPIDER_WORKER_CPU_PERCENT: The pool's share of the CPU cores, as a percentage.
  spider-worker-entrypoint:
    content: |
      #!/usr/bin/env bash

      set -o errexit
      set -o nounset
      set -o pipefail

      readonly POSITIVE_INTEGER_REGEX='^[1-9][0-9]*$$'

      num_workers="$${SPIDER_WORKER_COUNT:-}"
      if [[ -z "$$num_workers" ]]; then
          cpu_percent="$${SPIDER_WORKER_CPU_PERCENT:-}"
          if [[ ! "$$cpu_percent" =~ $$POSITIVE_INTEGER_REGEX ]]; then
              echo "Invalid worker CPU percent '$${cpu_percent}': expected a positive integer." >&2
              exit 1
          fi
          num_cpus=$$(nproc)
          num_workers=$$(( num_cpus * cpu_percent / 100 ))
          if (( num_workers < 1 )); then
              num_workers=1
          fi
      elif [[ ! "$$num_workers" =~ $$POSITIVE_INTEGER_REGEX ]]; then
          echo "Invalid worker count '$${num_workers}': expected a positive integer." >&2
          exit 1
      fi

      # As the container's PID 1, bash ignores a stop signal unless it is trapped.
      stop_requested=false
      trap 'stop_requested=true' TERM INT

      echo "Starting $${num_workers} execution manager(s)." >&2
      pids=()
      for (( i = 0; i < num_workers; i++ )); do
          if "$$stop_requested"; then
              break
          fi
          "$$@" &
          pids+=("$$!")
      done

      # Stop the whole pool once any worker exits or a stop signal arrives.
      exit_code=0
      if ! "$$stop_requested"; then
          wait -n || exit_code=$$?
      fi
      kill -TERM "$${pids[@]}" 2>/dev/null || true

      # `wait` returns early whenever a trapped signal arrives, so retry until every worker exits.
      until wait; do
          :
      done
      exit "$$exit_code"
