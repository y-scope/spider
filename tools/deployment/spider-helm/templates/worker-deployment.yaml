{{- range .Values.spiderConfig.worker.pools }}
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: {{ include "spider.componentFullname" (dict "root" $ "component" (printf "worker-%s" .name)) }}
  labels:
    {{- include "spider.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ printf "worker-%s" .name | quote }}
spec:
  replicas: {{ required "a worker pool needs `replicas`" .replicas }}
  selector:
    matchLabels:
      {{- include "spider.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ printf "worker-%s" .name | quote }}
  template:
    metadata:
      labels:
        {{- include "spider.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ printf "worker-%s" .name | quote }}
    spec:
      {{- with $.Values.spiderConfig.worker.service_account_name }}
      serviceAccountName: {{ tpl . $ | quote }}
      {{- end }}
      containers:
        - name: "execution-manager"
          image: {{ include "spider.imageRef" (dict "root" $ "component" "worker") | quote }}
          imagePullPolicy: {{ $.Values.image.worker.pullPolicy | quote }}
          command: ["spider-execution-manager", "--config", "/etc/spider/execution-manager.yaml"]
          env:
            - name: "RUST_LOG"
              value: {{ $.Values.spiderConfig.execution_manager.log_level | quote }}
            {{- with .resource_group }}
            - name: "SPIDER_EXTERNAL_RESOURCE_GROUP_ID"
              value: {{ required "a dedicated pool's `resource_group` needs `external_id`" (tpl (.external_id | default "") $) | quote }}
            - name: "SPIDER_RESOURCE_GROUP_PASSWORD"
              {{- $password := .password | default dict }}
              {{- if $password.secretKeyRef }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "a dedicated pool's `resource_group.password.secretKeyRef` needs `name`" (tpl ($password.secretKeyRef.name | default "") $) | quote }}
                  key: {{ required "a dedicated pool's `resource_group.password.secretKeyRef` needs `key`" (tpl ($password.secretKeyRef.key | default "") $) | quote }}
              {{- else }}
              value: {{ required "a dedicated pool's `resource_group.password` needs `value` or `secretKeyRef`" (tpl ($password.value | default "") $) | quote }}
              {{- end }}
            {{- end }}
            {{- with $.Values.spiderConfig.worker.extra_envs }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: "config"
              mountPath: "/etc/spider/execution-manager.yaml"
              subPath: "execution-manager.yaml"
              readOnly: true
            {{- with $.Values.spiderConfig.worker.extra_volume_mounts }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
      volumes:
        - name: "config"
          configMap:
            name: {{ include "spider.componentFullname" (dict "root" $ "component" "config") }}
        {{- with $.Values.spiderConfig.worker.extra_volumes }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
{{- end }}
