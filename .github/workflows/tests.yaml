name: "tests"

on:
  pull_request:
  push:
  schedule:
    # Run daily at 00:15 UTC (the 15 is to avoid periods of high load)
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"

  # Cancel in-progress jobs for efficiency
  cancel-in-progress: true

jobs:
  filter-relevant-changes:
    runs-on: "ubuntu-latest"
    outputs:
      cpp_changed: "${{steps.filter.outputs.cpp_changed}}"
      python_changed: "${{steps.filter.outputs.python_changed}}"
      rust_changed: "${{steps.filter.outputs.rust_changed}}"
      huntsman_e2e_tests_required: "${{steps.filter.outputs.huntsman_e2e_tests_required}}"
    steps:
      - uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"  # v6.0.2
        with:
          submodules: "recursive"

      - id: "filter"
        uses: "./.github/actions/filter-relevant-changes"
        with:
          workflow_path: ".github/workflows/tests.yaml"

  wolf-tests:
    needs: "filter-relevant-changes"
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || needs.filter-relevant-changes.outputs.cpp_changed == 'true'
      || needs.filter-relevant-changes.outputs.python_changed == 'true'
    strategy:
      matrix:
        os: ["ubuntu-22.04", "ubuntu-24.04"]
    runs-on: "${{matrix.os}}"
    steps:
      - name: "Remove default CMake installation in the runner"
        run: "rm '/usr/local/bin/cmake'"

      - uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"  # v6.0.2
        with:
          submodules: "recursive"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-python"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-go-task"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-uv"

      - name: "Install dev dependencies"
        run: "./tools/scripts/lib_install/ubuntu/install-dev-wolf.sh"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/print-tool-versions"

      - name: "Install project dependencies"
        timeout-minutes: 10
        env:
          SPIDER_DEPS_MAX_PARALLELISM_PER_TASK: "1"
        run: "task deps:lib_install"

      - run: "task test:cpp-unit-tests"

      - run: "task test:cpp-integration"

      - run: "task test:spider-py-unit-tests"

  rust-unit-tests:
    needs: "filter-relevant-changes"
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || needs.filter-relevant-changes.outputs.rust_changed == 'true'
    strategy:
      matrix:
        os: ["ubuntu-22.04", "ubuntu-22.04-arm", "ubuntu-24.04", "ubuntu-24.04-arm"]
    runs-on: "${{matrix.os}}"
    steps:
      - uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"  # v6.0.2
        with:
          submodules: "recursive"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-python"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-go-task"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-uv"

      - name: "Install dev dependencies"
        run: "./tools/scripts/lib_install/ubuntu/install-dev-huntsman.sh"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/print-tool-versions"

      - run: "task test:rust-unit-tests"

  huntsman-e2e-tests:
    needs: "filter-relevant-changes"
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || needs.filter-relevant-changes.outputs.huntsman_e2e_tests_required == 'true'
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - platform: "linux/amd64"
            runner: &huntsman_runner_x64 >-
              ${{
                github.repository_owner == 'y-scope'
                && fromJSON('["self-hosted","x64","ubuntu-noble","docker"]')
                || 'ubuntu-24.04'
              }}
            tag_suffix: "amd64"
          - platform: "linux/arm64"
            runner: &huntsman_runner_arm64 >-
              ${{
                github.repository_owner == 'y-scope'
                && fromJSON('["self-hosted","arm64","ubuntu-noble","docker"]')
                || 'ubuntu-24.04-arm'
              }}
            tag_suffix: "arm64"
    runs-on: "${{matrix.runner}}"
    steps:
      - uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"  # v6.0.2
        with:
          submodules: "recursive"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-python"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-go-task"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-uv"

      - name: "Install dev dependencies"
        run: "./tools/scripts/lib_install/ubuntu/install-dev-huntsman.sh"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/print-tool-versions"

      # Registry `src/` is excluded: cargo regenerates it locally from `registry/cache` without
      # a network fetch, so caching it just adds size for no benefit.
      - uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9"  # v6.1.0
        with:
          path: |-
            build/rust-targets
            build/toolchains/rust/.cargo/registry/cache
            build/toolchains/rust/.cargo/registry/index
          key: "huntsman-e2e-${{matrix.tag_suffix}}-${{hashFiles('Cargo.lock')}}"
          restore-keys: |-
            huntsman-e2e-${{matrix.tag_suffix}}-

      - run: "task test:huntsman-e2e-tests"
