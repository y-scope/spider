version: "3"

includes:
  toolchains: "toolchains.yaml"

vars:
  G_UNIT_TEST_BINARY: "{{.G_BUILD_SPIDER_DIR}}/tests/wolf/unitTest"
  G_TEST_VENV_DIR: "{{.G_BUILD_DIR}}/test-venv"
  G_TEST_VENV_CHECKSUM_FILE: "{{.G_BUILD_DIR}}/test#venv.md5"
  G_RUST_RELEASE_DIR: "{{.G_RUST_BUILD_DIR}}/release"
  G_TDL_PACKAGES_DIR: "{{.G_BUILD_DIR}}/tdl_packages"

  # MariaDB testing config
  G_MARIADB_DATABASE: "spider-db"
  G_MARIADB_USERNAME: "spider-user"
  G_MARIADB_PASSWORD: "spider-password"

tasks:
  cpp-unit-tests:
    cmds:
      - task: "wolf-mariadb-storage-task-executor"
        vars:
          STORAGE_TASK: "spider-wolf-unit-tests-executor"

  cpp-integration:
    cmds:
      - task: "wolf-mariadb-storage-task-executor"
        vars:
          STORAGE_TASK: "spider-wolf-integration-tests-executor"

  spider-py-unit-tests:
    cmds:
      - task: "wolf-mariadb-storage-task-executor"
        vars:
          STORAGE_TASK: "spider-py-unit-tests-executor"

  rust-unit-tests:
    deps:
      - ":build:rust"
    cmds:
      - task: "huntsman-mariadb-storage-task-executor"
        vars:
          STORAGE_TASK: "spider-huntsman-unit-tests-executor"

  huntsman-e2e-tests:
    vars:
      SPIDER_STORAGE_PUBLISHED_PORT: >-
        {{.SPIDER_STORAGE_PUBLISHED_PORT | default "50051"}}
      SPIDER_DATABASE_IMAGE_REF: >-
        {{.SPIDER_DATABASE_IMAGE_REF | default "mariadb:10.11.16"}}
    dir: "{{.ROOT_DIR}}"
    deps:
      - ":build:rust"
      - ":docker:build"
    cmds:
      - task: "build-and-stage-huntsman-tdl-package"
        vars:
          CARGO_PACKAGE_NAME: "huntsman-nn-tasks"
          CARGO_LIBRARY_NAME: "nn"
          TDL_PACKAGE_NAME: "nn"
      - "docker pull \"{{.SPIDER_DATABASE_IMAGE_REF}}\""
      - task: ":docker:compose:local:clean"
      # Register cleanup before startup so a partially created Compose deployment is removed if
      # `docker:compose:local:up` fails.
      - defer:
          task: ":docker:compose:local:clean"
      - task: ":docker:compose:local:up"
        vars:
          SPIDER_PULL_POLICY: "never"
          SPIDER_STORAGE_PUBLISHED_PORT: "{{.SPIDER_STORAGE_PUBLISHED_PORT}}"
          SPIDER_DATABASE_IMAGE_REF: "{{.SPIDER_DATABASE_IMAGE_REF}}"
          SPIDER_STORAGE_IMAGE_REF:
            sh: "cat '{{.G_BUILD_DIR}}/spider-storage-image.id'"
          SPIDER_SCHEDULER_IMAGE_REF:
            sh: "cat '{{.G_BUILD_DIR}}/spider-scheduler-image.id'"
          SPIDER_WORKER_IMAGE_REF:
            sh: "cat '{{.G_BUILD_DIR}}/spider-worker-image.id'"
          SPIDER_WORKER_LIBRARY_DIR: "{{.G_TDL_PACKAGES_DIR}}"
      - |-
        . "{{.G_RUST_TOOLCHAIN_ENV_FILE}}"
        SPIDER_ENDPOINT="http://127.0.0.1:{{.SPIDER_STORAGE_PUBLISHED_PORT}}" \
        SPIDER_CONCURRENCY="8" \
          cargo nextest run --release --package e2e --test nn -- --nocapture

  build-unit-test:
    internal: true
    deps:
      - task: ":build:cpp-target"
        vars:
          TARGETS: ["spider_task_executor", "unitTest", "worker_test"]

  venv:
    internal: true
    vars:
      CHECKSUM_FILE: "{{.G_TEST_VENV_CHECKSUM_FILE}}"
      OUTPUT_DIR: "{{.G_TEST_VENV_DIR}}"
    sources:
      - "{{.ROOT_TASKFILE}}"
      - "{{.TASKFILE}}"
      - "requirements-dev.txt"
    generates: ["{{.CHECKSUM_FILE}}"]
    run: "once"
    deps:
      - ":init"
      - task: ":utils:checksum:validate"
        vars:
          CHECKSUM_FILE: "{{.CHECKSUM_FILE}}"
          INCLUDE_PATTERNS: ["{{.OUTPUT_DIR}}"]
    cmds:
      - task: ":utils:misc:create-venv"
        vars:
          LABEL: "test"
          OUTPUT_DIR: "{{.OUTPUT_DIR}}"
          REQUIREMENTS_FILE: "{{.ROOT_DIR}}/requirements-dev.txt"
      # This command must be last
      - task: ":utils:checksum:compute"
        vars:
          CHECKSUM_FILE: "{{.CHECKSUM_FILE}}"
          INCLUDE_PATTERNS: ["{{.OUTPUT_DIR}}"]

  # A generic wrapper that runs the given task with a MariaDB storage backend for Spider Wolf.
  #
  # @param {string} STORAGE_TASK The task to execute. The task must accept no parameters other than
  # `SPIDER_STORAGE_URL`, which is set to the MariaDB instance URL.
  wolf-mariadb-storage-task-executor:
    internal: true
    vars:
      MARIADB_CONTAINER_NAME:
        # Normalize UUID casing: macOS generates uppercase while Linux generates lowercase.
        sh: "uuidgen | tr '[:upper:]' '[:lower:]' | sed 's/^/spider-mariadb-/'"
      MARIADB_PORT:
        sh: "tools/scripts/get_free_port.py"
    requires:
      vars: ["STORAGE_TASK"]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |-
        tools/scripts/mariadb/start.py \
        --name "{{.MARIADB_CONTAINER_NAME}}" \
        --port "{{.MARIADB_PORT}}" \
        --database "{{.G_MARIADB_DATABASE}}" \
        --username "{{.G_MARIADB_USERNAME}}" \
        --password "{{.G_MARIADB_PASSWORD}}"
      - defer: |-
          {{.ROOT_DIR}}/tools/scripts/mariadb/stop.py \
          --name "{{.MARIADB_CONTAINER_NAME}}"
      - |-
        tools/scripts/mariadb/wolf/init_db.py \
        --port "{{.MARIADB_PORT}}" \
        --database "{{.G_MARIADB_DATABASE}}" \
        --username "{{.G_MARIADB_USERNAME}}" \
        --password "{{.G_MARIADB_PASSWORD}}"
      - task: "{{.STORAGE_TASK}}"
        vars:
          SPIDER_STORAGE_URL:
            "jdbc:mariadb://127.0.0.1:{{.MARIADB_PORT}}/{{.G_MARIADB_DATABASE}}?\
            user={{.G_MARIADB_USERNAME}}&password={{.G_MARIADB_PASSWORD}}"

  # A generic wrapper that runs the given task with a MariaDB storage backend.
  #
  # @param {string} STORAGE_TASK The task to execute. The task must accept exactly the following
  # parameters for database connection:
  # - MARIADB_PORT
  # - MARIADB_DATABASE
  # - SPIDER_STORAGE_DB_USERNAME
  # - SPIDER_STORAGE_DB_PASSWORD
  huntsman-mariadb-storage-task-executor:
    internal: true
    vars:
      MARIADB_CONTAINER_NAME:
        # Normalize UUID casing: macOS generates uppercase while Linux generates lowercase.
        sh: "uuidgen | tr '[:upper:]' '[:lower:]' | sed 's/^/spider-mariadb-/'"
      MARIADB_PORT:
        sh: "tools/scripts/get_free_port.py"
    requires:
      vars: ["STORAGE_TASK"]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |-
        tools/scripts/mariadb/start.py \
        --name "{{.MARIADB_CONTAINER_NAME}}" \
        --port "{{.MARIADB_PORT}}" \
        --database "{{.G_MARIADB_DATABASE}}" \
        --username "{{.G_MARIADB_USERNAME}}" \
        --password "{{.G_MARIADB_PASSWORD}}"
      - defer: |-
          {{.ROOT_DIR}}/tools/scripts/mariadb/stop.py \
          --name "{{.MARIADB_CONTAINER_NAME}}"
      - task: "{{.STORAGE_TASK}}"
        vars:
          MARIADB_PORT: "{{.MARIADB_PORT}}"
          MARIADB_DATABASE: "{{.G_MARIADB_DATABASE}}"
          SPIDER_STORAGE_DB_USERNAME: "{{.G_MARIADB_USERNAME}}"
          SPIDER_STORAGE_DB_PASSWORD: "{{.G_MARIADB_PASSWORD}}"

  # Internal task that runs all spider-py's unit tests.
  #
  # @param {string} SPIDER_STORAGE_URL An URL pointing to the MariaDB instance.
  spider-py-unit-tests-executor:
    internal: true
    env:
      # Don't create __pycache__ directories in the source tree.
      PYTHONDONTWRITEBYTECODE: "1"
      SPIDER_STORAGE_URL: "{{.SPIDER_STORAGE_URL}}"
    requires:
      vars: ["SPIDER_STORAGE_URL"]
    dir: "{{.G_SRC_PYTHON_DIR}}"
    cmd: "uv run pytest"

  # Internal task that runs all Spider Wolf's unit tests.
  #
  # @param {string} SPIDER_STORAGE_URL An URL pointing to the MariaDB instance.
  spider-wolf-unit-tests-executor:
    internal: true
    env:
      SPIDER_STORAGE_URL: "{{.SPIDER_STORAGE_URL}}"
    requires:
      vars: ["SPIDER_STORAGE_URL"]
    dir: "{{.ROOT_DIR}}"
    deps:
      - "build-unit-test"
    cmd: "{{.G_UNIT_TEST_BINARY}}"

  # Internal task that runs all Spider Wolf's integration tests.
  #
  # @param {string} SPIDER_STORAGE_URL An URL pointing to the MariaDB instance.
  spider-wolf-integration-tests-executor:
    internal: true
    env:
      SPIDER_STORAGE_URL: "{{.SPIDER_STORAGE_URL}}"
    requires:
      vars: ["SPIDER_STORAGE_URL"]
    dir: "{{.G_BUILD_SPIDER_DIR}}"
    deps:
      - "venv"
      - task: ":build:cpp-target"
        vars:
          TARGETS: [
            "spider_task_executor",
            "worker_test",
            "client_test",
            "spider_worker",
            "spider_scheduler",
            "integrationTest"
          ]
    cmds:
      - |-
        . {{.G_TEST_VENV_DIR}}/bin/activate
        {{.G_TEST_VENV_DIR}}/bin/pytest tests/wolf/integration

  # Internal task that runs all Spider Huntsman's unit tests.
  #
  # @param {string} SPIDER_STORAGE_URL An URL pointing to the MariaDB instance.
  spider-huntsman-unit-tests-executor:
    internal: true
    env:
      MARIADB_PORT: "{{.MARIADB_PORT}}"
      MARIADB_DATABASE: "{{.MARIADB_DATABASE}}"
      SPIDER_STORAGE_DB_USERNAME: "{{.SPIDER_STORAGE_DB_USERNAME}}"
      SPIDER_STORAGE_DB_PASSWORD: "{{.SPIDER_STORAGE_DB_PASSWORD}}"
      SPIDER_TDL_PACKAGE_COMPLEX: "{{.G_TDL_PACKAGES_DIR}}/complex/libcomplex.so"
      SPIDER_TDL_PACKAGE_DIR: "{{.G_TDL_PACKAGES_DIR}}"
      SPIDER_TASK_EXECUTOR_BIN: "{{.G_RUST_RELEASE_DIR}}/spider-task-executor"
      SPIDER_TEST_INSTRUMENT_OUTPUT_DIR:
        sh: "echo {{.G_BUILD_DIR}}/spider-instrument-$(uuidgen)"
    requires:
      vars: [
        "MARIADB_PORT",
        "MARIADB_DATABASE",
        "SPIDER_STORAGE_DB_USERNAME",
        "SPIDER_STORAGE_DB_PASSWORD"
      ]
    dir: "{{.ROOT_DIR}}"
    deps: ["toolchains:rust"]
    cmds:
      - "mkdir -p ${SPIDER_TEST_INSTRUMENT_OUTPUT_DIR}"
      - defer: "rm -rf ${SPIDER_TEST_INSTRUMENT_OUTPUT_DIR}"
      - task: "build-and-stage-huntsman-tdl-package"
        vars:
          CARGO_PACKAGE_NAME: "huntsman-complex"
          CARGO_LIBRARY_NAME: "huntsman_complex"
          TDL_PACKAGE_NAME: "complex"
      - task: "build-and-stage-huntsman-tdl-package"
        vars:
          CARGO_PACKAGE_NAME: "integration-test-tasks"
          CARGO_LIBRARY_NAME: "integration_test_tasks"
          TDL_PACKAGE_NAME: "integration_test_tasks"
      - |-
        . "{{.G_RUST_TOOLCHAIN_ENV_FILE}}"
        cargo nextest run --all --all-features --run-ignored all --release
      - |-
        for f in ${SPIDER_TEST_INSTRUMENT_OUTPUT_DIR}/*; do
          if [ -f "$f" ]; then
            echo "=== Instrument: $(basename "$f") ==="
            cat "$f"
            echo ""
          fi
        done

  # Builds and stages a Huntsman TDL package library in the task executor's package layout.
  #
  # @param {string} CARGO_PACKAGE_NAME The Cargo package that builds the library.
  # @param {string} CARGO_LIBRARY_NAME The Cargo library target name.
  # @param {string} TDL_PACKAGE_NAME The TDL package directory and runtime library name.
  build-and-stage-huntsman-tdl-package:
    internal: true
    requires:
      vars: ["CARGO_PACKAGE_NAME", "CARGO_LIBRARY_NAME", "TDL_PACKAGE_NAME"]
    deps: ["toolchains:rust"]
    cmds:
      - |-
        . "{{.G_RUST_TOOLCHAIN_ENV_FILE}}"
        cargo build --release --package '{{.CARGO_PACKAGE_NAME}}'
      - "mkdir -p '{{.G_TDL_PACKAGES_DIR}}/{{.TDL_PACKAGE_NAME}}'"
      - >-
        cp
        '{{.G_RUST_RELEASE_DIR}}/lib{{.CARGO_LIBRARY_NAME}}.so'
        '{{.G_TDL_PACKAGES_DIR}}/{{.TDL_PACKAGE_NAME}}/lib{{.TDL_PACKAGE_NAME}}.so'
