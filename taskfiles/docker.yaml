version: "3"

vars:
  G_BUILD_SCRIPT: "{{.ROOT_DIR}}/tools/docker/build.sh"
  G_SPIDER_COMPOSE_DIR: "{{.ROOT_DIR}}/tools/deployment/spider-compose"

tasks:
  build:
    cmds:
      - task: "build-storage"
      - task: "build-scheduler"
      - task: "build-worker"

  build-storage:
    deps: [":init"]
    cmd: "'{{.G_BUILD_SCRIPT}}' storage"

  build-scheduler:
    deps: [":init"]
    cmd: "'{{.G_BUILD_SCRIPT}}' scheduler"

  build-worker:
    deps: [":init"]
    cmd: "'{{.G_BUILD_SCRIPT}}' worker"

  compose:validate:
    dir: "{{.G_SPIDER_COMPOSE_DIR}}"
    cmd: "docker compose --env-file .env.example --file compose.yaml config --quiet"

  compose:publish:
    requires:
      vars: ["OCI_REFERENCE"]
    deps: ["compose:validate"]
    dir: "{{.G_SPIDER_COMPOSE_DIR}}"
    cmd: >-
      oras push
      --artifact-type "application/vnd.yscope.spider.compose"
      '{{.OCI_REFERENCE}}'
      "compose.yaml:application/yaml"
      "configs/:application/vnd.yscope.spider.compose.configs.tar"
      ".env.example:text/plain"

  compose:up:
    dir: "{{.G_SPIDER_COMPOSE_DIR}}"
    cmd: "docker compose --file compose.yaml up --detach --wait --wait-timeout 300"

  compose:down:
    dir: "{{.G_SPIDER_COMPOSE_DIR}}"
    cmd: "docker compose --file compose.yaml down"

  compose:clean:
    dir: "{{.G_SPIDER_COMPOSE_DIR}}"
    cmd: "docker compose --file compose.yaml down --volumes --remove-orphans"

  # Starts a local Docker Compose deployment with the library directory mounted
  # into every worker.
  #
  # NOTE:
  #
  # * Users can override image refs for each service; when unset, each defaults to
  #   `ghcr.io/y-scope/spider/<service>:${SPIDER_IMAGE_TAG:-main}`.
  # * Values in the `env` section take precedence over those loaded from the dotenv file.
  #
  # @param {string} SPIDER_ENV_FILE An absolute path to a dotenv file to load into the deployment's
  # environment. If not set, no dotenv file is loaded.
  # @param {string} SPIDER_PULL_POLICY The image pull policy. If not set, default to "always".
  # @param {string} SPIDER_STORAGE_IMAGE_REF The storage image reference.
  # @param {string} SPIDER_SCHEDULER_IMAGE_REF The scheduler image reference.
  # @param {string} SPIDER_WORKER_IMAGE_REF The worker image reference.
  # @param {string} SPIDER_WORKER_LIBRARY_DIR The host directory containing the libraries.
  # @param {string} SPIDER_DEDICATED_WORKER_REPLICAS Replica count for the dedicated worker pool.
  # Defaults to 0 (pool disabled).
  # @param {string} SPIDER_DEDICATED_RESOURCE_GROUP_ID External resource-group ID the dedicated
  # worker pool pins to.
  # @param {string} SPIDER_COMPOSE_UP_FLAGS Flags passed to `docker compose up`. Defaults to
  # "--wait --wait-timeout 300".
  # @param {string} SPIDER_COMPOSE_UP_SERVICES Optional service names to limit the `up` to.
  compose:local:up:
    dotenv:
      - >-
        {{.SPIDER_ENV_FILE | default "/dev/null"}}
    env:
      SPIDER_PULL_POLICY: "{{.SPIDER_PULL_POLICY}}"
      SPIDER_STORAGE_IMAGE_REF: "{{.SPIDER_STORAGE_IMAGE_REF}}"
      SPIDER_SCHEDULER_IMAGE_REF: "{{.SPIDER_SCHEDULER_IMAGE_REF}}"
      SPIDER_WORKER_IMAGE_REF: "{{.SPIDER_WORKER_IMAGE_REF}}"
      SPIDER_DEDICATED_WORKER_REPLICAS: "{{.SPIDER_DEDICATED_WORKER_REPLICAS | default 0}}"
      SPIDER_DEDICATED_RESOURCE_GROUP_ID: "{{.SPIDER_DEDICATED_RESOURCE_GROUP_ID}}"
      SPIDER_WORKER_LIBRARY_DIR: >-
        {{- if .SPIDER_WORKER_LIBRARY_DIR}}
          {{- if osIsAbs .SPIDER_WORKER_LIBRARY_DIR}}
            {{- osClean .SPIDER_WORKER_LIBRARY_DIR}}
          {{- else}}
            {{- joinPath .ROOT_DIR .SPIDER_WORKER_LIBRARY_DIR}}
          {{- end}}
        {{- end}}
    dir: "{{.G_SPIDER_COMPOSE_DIR}}"
    cmd: >-
      docker compose --project-name spider-local --file compose.yaml
      --file compose.local.yaml up --detach
      {{.SPIDER_COMPOSE_UP_FLAGS | default "--wait --wait-timeout 300"}}
      {{.SPIDER_COMPOSE_UP_SERVICES}}

  compose:local:down:
    dir: "{{.G_SPIDER_COMPOSE_DIR}}"
    cmd: "docker compose --project-name spider-local --file compose.yaml down"

  compose:local:clean:
    dir: "{{.G_SPIDER_COMPOSE_DIR}}"
    cmd: >-
      docker compose --project-name spider-local --file compose.yaml down
      --volumes --remove-orphans
